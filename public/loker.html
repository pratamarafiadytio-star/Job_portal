<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan ke Lowongan KerjaHub...</title>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('id') || urlParams.get('job');
    if (jobId) {
      window.location.replace('./?job=' + encodeURIComponent(jobId));
    } else {
      window.location.replace('./');
    }
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc;">
  <div style="text-align: center; padding: 24px;">
    <h2>Mengarahkan ke Portal Lowongan KerjaHub...</h2>
    <p>Jika tidak diarahkan otomatis, <a href="./" style="color: #38bdf8; font-weight: 700;">klik di sini untuk melihat semua lowongan</a>.</p>
  </div>
</body>
</html>
